name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ---------------------------------------------------------------------------
  # Backend quality gate — ruff lint + pytest. Fails on any lint error or test
  # failure. Dependencies cached via setup-python (pip).
  # ---------------------------------------------------------------------------
  backend:
    name: Backend (ruff + pytest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install backend dependencies
        run: pip install -r requirements.txt

      - name: Install test dependencies
        run: pip install matplotlib

      - name: Ruff lint (fail on any issue)
        run: ruff check src tests

      - name: Ruff format check (fail on any drift)
        run: ruff format --check src tests

      - name: Run pytest (fail on any failure)
        run: pytest -q

  # ---------------------------------------------------------------------------
  # Frontend quality gate — Node LTS (v22), npm ci with cache, vitest + build.
  # Fails on any test failure or build error.
  # ---------------------------------------------------------------------------
  frontend:
    name: Frontend (vitest + build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ui
    steps:
      - uses: actions/checkout@v7

      - name: Set up Node.js LTS
        uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm
          cache-dependency-path: ui/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run frontend tests (fail on any failure)
        run: npm test

      - name: Type-check + production build
        run: npm run build

      - name: Upload UI bundle
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ui-dist
          path: ui/dist
