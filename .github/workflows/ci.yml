name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  backend-lint:
    name: Backend lint (ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements.txt
      - run: ruff check .
      - run: ruff format --check . || true

  backend-tests:
    name: Backend tests (pytest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Run pytest
        run: pytest -q
      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        with:
          name: pytest-coverage
          path: .coverage
        if: always()

  frontend-tests:
    name: Frontend tests (vitest + build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ui
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - run: npm ci
      - run: npm test
      - name: Production build
        run: npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: ui-dist
          path: ui/dist

  docker-build:
    name: Docker build (api + react)
    runs-on: ubuntu-latest
    needs: [backend-tests, frontend-tests]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Validate compose config
        run: |
          pip install pyyaml
          python - <<'EOF'
          import yaml
          with open("docker-compose.yml") as f:
              cfg = yaml.safe_load(f)
          assert set(cfg["services"]) >= {"api", "react", "nginx", "neo4j", "qdrant", "redis"}
          print("compose services OK:", ", ".join(cfg["services"]))
          EOF
      - name: Build api image
        run: docker build -f deploy/backend/Dockerfile -t explaintool-api:ci .
      - name: Build react image
        run: docker build -f deploy/frontend/Dockerfile -t explaintool-ui:ci .

  deploy-config-check:
    name: Deploy config validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Validate production secrets fail-fast
        run: |
          # Production template must FAIL validation (LLM_API_KEY placeholder empty).
          if python -m deploy.config.cli validate --env production; then
            echo "ERROR: production validate unexpectedly passed with empty secrets"
            exit 1
          fi
          echo "OK: production validation fails fast as expected"
      - name: Validate development profile
        run: python -m deploy.config.cli validate --env development
