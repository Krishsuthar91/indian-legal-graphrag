[build-system]
requires = ["setuptools>=75.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "explaintool"
version = "0.1.0"
description = "Explainable Multilingual Hierarchical Graph-RAG with Hybrid Hierarchical Graph Retrieval (HHGR) for Indian Legal Document Intelligence"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.6",
    "pydantic>=2.9.2",
    "pydantic-settings>=2.5.2",
    "python-dotenv>=1.0.1",
    "structlog>=24.4.0",
    "python-json-logger>=2.0.7",
    "httpx>=0.27.2",
    "pdfplumber>=0.11.0",
    "python-docx>=1.0.0",
    "pymupdf>=1.24.0",
    "Pillow>=10.0.0",
    "pytesseract>=0.3.10",
    "langdetect>=1.0.9",
    "neo4j>=5.0.0",
    "qdrant-client>=1.9.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.3",
    "pytest-asyncio>=0.24.0",
    "reportlab>=4.0.0",
    "ruff>=0.6.9",
    "mypy>=1.11.2",
]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_return_any = true
warn_unused_configs = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
