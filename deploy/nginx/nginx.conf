# ---------------------------------------------------------------------------
# Edge nginx — the single public entry point.
#
# Responsibilities:
#   - route /api to the backend api service (port 8000)
#   - serve the React static bundle from the react service
#   - HTTPS-ready TLS block (uncomment server :443 + certificate paths)
#   - gzip compression, request size limits, security headers
#   - WebSocket upgrade support for future streaming endpoints
#
# Expected service names (Docker Compose): api, react
# ---------------------------------------------------------------------------

user nginx;
worker_processes auto;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for" '
                    'rt=$request_time';
    access_log /var/log/nginx/access.log main;
    error_log  /var/log/nginx/error.log warn;

    sendfile        on;
    tcp_nopush      on;
    tcp_nodelay     on;
    keepalive_timeout 65;
    server_tokens   off;

    # Connection / request limits.
    client_body_timeout   15s;
    client_header_timeout 15s;
    send_timeout          15s;
    client_max_body_size  10m;

    # gzip compression.
    gzip              on;
    gzip_comp_level   5;
    gzip_min_length   1024;
    gzip_vary         on;
    gzip_proxied      any;
    gzip_types
        text/plain
        text/css
        application/json
        application/javascript
        application/xml
        image/svg+xml;

    # WebSocket upgrade mapping.
    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    # Upstream services (Docker Compose network names).
    upstream explaintool_api {
        server api:8000;
        keepalive 16;
    }

    upstream explaintool_web {
        server react:80;
        keepalive 16;
    }

    # Redirect plain HTTP -> HTTPS when TLS is enabled.
    # server {
    #     listen 80;
    #     server_name _;
    #     return 301 https://$host$request_uri;
    # }

    server {
        listen 80;
        # listen 443 ssl http2;
        server_name _;

        # TLS certificate paths (mount via secrets in production).
        # ssl_certificate     /etc/nginx/certs/fullchain.pem;
        # ssl_certificate_key /etc/nginx/certs/privkey.pem;
        # ssl_protocols TLSv1.2 TLSv1.3;

        # Security headers.
        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options DENY always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;
        # CSP tuned for the React dashboard (inline styles used by chart libs).
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self' data:; connect-src 'self'; object-src 'none'; frame-ancestors 'none'; base-uri 'self'" always;

        # API reverse proxy.
        location /api/ {
            proxy_pass http://explaintool_api;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_connect_timeout 10s;
            proxy_read_timeout 120s;
            proxy_send_timeout 120s;
        }

        # Swagger / OpenAPI docs proxied to the backend.
        location ~ ^/(docs|redoc|openapi\.json) {
            proxy_pass http://explaintool_api;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Health checks against the API (used by load balancers / k8s).
        location = /healthz {
            proxy_pass http://explaintool_api;
            proxy_set_header Host $host;
        }

        # Frontend SPA served by the react service.
        location / {
            proxy_pass http://explaintool_web;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }
}
